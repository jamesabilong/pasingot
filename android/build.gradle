// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // Pinned once here so :app and :wear can't drift on Kotlin/Data Layer
        // versions — see the plan's note on this being a common source of
        // runtime Wearable Data Layer failures.
        kotlinVersion = '1.9.24'
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Kotlin support for :app (native data-layer code) and :wear (Compose).
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
