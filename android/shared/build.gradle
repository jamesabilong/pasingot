// Plain kotlin("jvm") module — no Android/Compose deps — so both :app (phone)
// and :wear (watch) can depend on it without pulling in unrelated toolchains,
// and so the payload/log/session shapes can never drift between the two.
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'kotlinx-serialization'

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinxSerializationJsonVersion"
}

// The plain kotlin("jvm") plugin doesn't auto-align its Java/Kotlin compile
// targets the way the Android Kotlin plugin does for :app/:wear — compileJava
// silently defaults to whatever JDK is running Gradle (now 21, since the
// daemon JVM toolchain migration), while compileKotlin stays wherever it's
// pinned separately, causing an "Inconsistent JVM Target Compatibility"
// error. A JVM toolchain pins both consistently in one place.
kotlin {
    jvmToolchain(17)
}
