apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'kotlinx-serialization'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "app.personal.workouttracker.wear"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        // Wearable Data Layer only routes app data between APKs whose
        // application id and signing certificate match on both devices.
        applicationId "app.personal.workouttracker"
        minSdkVersion rootProject.ext.minSdkVersion // 33 — Galaxy Watch 7 ships Wear OS 5 (API 34)
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // Bumped from 1.8 to 17: the Compose compiler plugin pushed
        // compileDebugKotlin's default jvmTarget to 21 (matching the Gradle
        // daemon's own JDK) in this Kotlin/AGP version, and Java/Kotlin
        // targets must match exactly, or compileDebugKotlin fails outright.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }
}

// compileOptions above doesn't reliably pin compileDebugKotlin's target in
// this Kotlin/AGP version (it kept defaulting to 21, the Gradle daemon's own
// JDK, regardless) — a JVM toolchain pins both Java and Kotlin consistently
// in one place instead, same fix as :shared.
kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation project(':shared')

    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.activity:activity-compose:$activityComposeVersion"
    implementation "androidx.wear.compose:compose-material:$wearComposeVersion"
    implementation "androidx.wear.compose:compose-foundation:$wearComposeVersion"
    implementation "androidx.wear.compose:compose-navigation:$wearComposeVersion"
    implementation "androidx.navigation:navigation-compose:2.8.4"
    implementation "androidx.wear:wear-tooling-preview:$wearToolingPreviewVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"

    implementation "com.google.android.gms:play-services-wearable:$playServicesWearableVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:$kotlinxCoroutinesPlayServicesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinxCoroutinesVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinxSerializationJsonVersion"

    implementation "androidx.datastore:datastore-preferences:$datastorePreferencesVersion"
    implementation "androidx.work:work-runtime-ktx:$workManagerVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.8.7"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.7"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}
