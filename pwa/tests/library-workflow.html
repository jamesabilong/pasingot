<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Library workflow regression checks</title>
<h1>Library workflow regression checks</h1>
<p>Disposable database; no personal workout data is used.</p>
<pre id="result">Running…</pre>
<div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { useLibraryWorkflow } from '/src/hooks/useLibraryWorkflow.ts';
import { getAll, getRecord, STORES } from '/src/lib/db.ts';
import { initialDraft } from '/src/lib/workout-planning.ts';
import { buildCatalogFilterOptions, filterCatalog } from '/src/lib/library-filters.ts';
const factory = window.indexedDB;
const database = `pasingot-library-workflow-${crypto.randomUUID()}`;
Object.defineProperty(window, 'indexedDB', { configurable: true, value: { open: (_name, version) => factory.open(database, version) } });
const originalConfirm = window.confirm;
let confirmed = true;
window.confirm = () => confirmed;
const checks = [];
const check = (condition, message) => { if (!condition) throw new Error(message); checks.push(`PASS: ${message}`); };
const base = { schemaVersion: 1, sourceId: 1, name: 'fixture-squat', displayName: 'Fixture Squat', category: 'Strength', primaryMuscles: [' Legs ', 'Quads'], secondaryMuscles: ['Abs'], equipment: ['Dumbbell'], featured: true, minimumLevel: 'beginner', progressionGroup: 'squat', progressionLevel: 'beginner', license: 'Fixture', licenseUrl: '', author: 'Fixture', sourceUrl: '' };
const other = { ...base, sourceId: 2, name: 'fixture-hold', displayName: 'Fixture Hold', category: 'Mobility', primaryMuscles: ['Abs', 'legs'], secondaryMuscles: ['Triceps'], equipment: ['dumbbell ', 'Gym mat'], featured: false };
const advanced = { ...base, sourceId: 3, name: 'fixture-advanced', displayName: 'Fixture Advanced', primaryMuscles: ['Triceps'], equipment: ['Barbell'], minimumLevel: 'advanced' };
let api;
let logs = [];
const toasts = [];
const root = createRoot(document.getElementById('root'));
function Harness() {
  const [catalog, setCatalog] = React.useState([base, other, advanced]);
  const [customExercises, setCustomExercises] = React.useState([]);
  const [draft, setDraft] = React.useState(initialDraft);
  const [workouts, setWorkouts] = React.useState([]);
  const library = useLibraryWorkflow({ catalog, setCatalog, customExercises, setCustomExercises, draft, setDraft, workouts, logs, setLogEntries: [], sessionEvents: [], customQuestDefinitions: [], refreshWorkouts: async () => setWorkouts(await getAll(STORES.workouts)), addToast: message => toasts.push(message) });
  React.useLayoutEffect(() => { api = { ...library, catalog, setCatalog, customExercises, draft, workouts }; });
  return null;
}
const settle = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
const render = async () => { root.render(React.createElement(Harness)); await settle(); };
try {
  const missing = { ...base, sourceId: 4, primaryMuscles: [], equipment: [] };
  const bodyweight = { ...base, sourceId: 5, primaryMuscles: [' all ', ' ', 'abs'], equipment: ['none (bodyweight exercise)', 'DUMBBELL', ' all '] };
  const optionCatalog = [base, other, advanced, missing, bodyweight];
  const metadataBefore = JSON.stringify(optionCatalog);
  const muscles = buildCatalogFilterOptions(optionCatalog, 'primaryMuscles');
  const equipment = buildCatalogFilterOptions(optionCatalog, 'equipment');
  check(muscles.filter(option => option.value === 'legs').length === 1 && muscles.some(option => option.value === 'abs'), 'muscle options merge trimmed case variants and retain all primary values');
  check(equipment.filter(option => option.value === 'dumbbell').length === 1 && equipment.every(option => option.value && option.label), 'equipment options deduplicate variants and exclude empty metadata');
  check(muscles.some(option => option.value === 'all') && equipment.some(option => option.value === 'all'), 'literal all metadata remains selectable separately from empty All sentinel');
  check(JSON.stringify(equipment) === JSON.stringify(buildCatalogFilterOptions([...optionCatalog].reverse(), 'equipment')), 'option order and labels remain stable when catalog row order changes');
  const allFilters = { search: '', category: 'all', featuredOnly: false, level: 'advanced', muscle: '', equipment: '' };
  check(filterCatalog(optionCatalog, allFilters).length === 5, 'All filters include entries with missing metadata');
  check(filterCatalog(optionCatalog, { ...allFilters, muscle: ' ABS ' }).map(item => item.sourceId).join() === '2,5', 'primary muscle matches normalize case and whitespace and exclude secondary-only matches');
  check(filterCatalog(optionCatalog, { ...allFilters, muscle: 'leg' }).length === 0, 'muscle matches are exact metadata labels rather than substrings');
  check(filterCatalog(optionCatalog, { ...allFilters, muscle: 'Quads', equipment: 'dumbbell' }).map(item => item.sourceId).join() === '1', 'muscle and equipment filters match any array value and compose');
  check(filterCatalog(optionCatalog, { ...allFilters, equipment: 'none (bodyweight exercise)' }).map(item => item.sourceId).join() === '5', 'explicit bodyweight equipment does not include unknown equipment');
  check(filterCatalog(optionCatalog, { ...allFilters, equipment: 'all' }).map(item => item.sourceId).join() === '5', 'literal all equipment filters rather than broadening results');
  check(filterCatalog(optionCatalog, { ...allFilters, search: 'fixture-hold', category: 'Mobility', muscle: 'legs', equipment: 'Gym mat' }).map(item => item.sourceId).join() === '2', 'metadata filters compose with search and category');
  check(filterCatalog(optionCatalog, { ...allFilters, equipment: 'Barbell', level: 'beginner' }).length === 0, 'metadata matching preserves selected level eligibility');
  check(JSON.stringify(optionCatalog) === metadataBefore, 'options and filtering preserve source records and metadata');
  await render();
  const initialDraftSnapshot = JSON.stringify(api.draft);
  const initialLevelCounts = JSON.stringify(api.levelCounts);
  check(api.muscle === '' && api.equipment === '' && api.filteredCatalog.length === 2, 'new filters start at All and keep default level eligibility');
  check(api.muscleOptions.some(option => option.value === 'triceps') && api.equipmentOptions.some(option => option.value === 'barbell'), 'options come from the full catalog including higher-level exercises');
  api.setMuscle(' LEGS '); api.setEquipment('GYM MAT'); await settle();
  check(api.muscle === 'legs' && api.equipment === 'gym mat' && api.filteredCatalog[0]?.sourceId === 2 && api.filteredCatalog.length === 1, 'hook normalizes selection keys and composes both metadata filters');
  api.setSearch('fixture-hold'); api.setCategory('Mobility'); await settle();
  check(api.filteredCatalog.length === 1 && api.muscleOptions.length === 4 && api.equipmentOptions.length === 3, 'search and category compose without narrowing option lists');
  api.setFeaturedOnly(true); await settle();
  check(api.filteredCatalog.length === 0 && JSON.stringify(api.levelCounts) === initialLevelCounts, 'common filter composes without changing level counts');
  api.clearFilters(); await settle();
  check(api.search === '' && api.category === 'all' && !api.featuredOnly && api.muscle === '' && api.equipment === '' && api.filteredCatalog.length === 2, 'clear resets all display filters');
  check(JSON.stringify(api.draft) === initialDraftSnapshot && !(await getRecord(STORES.appState, 'playlistDraft')), 'filtering and clear preserve draft level and items without durable writes');
  await api.saveDraft({ ...api.draft, level: 'advanced' }); await settle();
  const savedAdvancedDraft = JSON.stringify(await getRecord(STORES.appState, 'playlistDraft'));
  api.setMuscle('triceps'); api.setEquipment('barbell'); await settle();
  check(api.filteredCatalog.length === 1 && api.filteredCatalog[0].sourceId === 3, 'higher selected level enables an exact metadata match');
  api.clearFilters(); await settle();
  check(api.draft.level === 'advanced' && api.filteredCatalog.length === 3 && JSON.stringify(await getRecord(STORES.appState, 'playlistDraft')) === savedAdvancedDraft, 'clear preserves selected advanced level and durable draft');
  await api.saveDraft({ ...api.draft, level: 'beginner' }); await settle();
  api.setSearch('dumbbell'); await settle();
  check(api.filteredCatalog.length === 2, 'search matches equipment');
  api.setCategory('Mobility'); await settle();
  check(api.filteredCatalog.length === 1 && api.filteredCatalog[0].sourceId === 2, 'category combines with search');
  api.setFeaturedOnly(true); await settle();
  check(api.filteredCatalog.length === 0, 'featured filter excludes nonfeatured matches');
  api.setCategory('all'); api.setSearch(''); api.setFeaturedOnly(false); await settle();
  await api.addCatalogExercise(1); await settle();
  await api.addCatalogExercise(1); await settle();
  check(api.draft.items.length === 1 && (await getRecord(STORES.appState, 'playlistDraft')).items.length === 1, 'playlist additions persist and reject duplicate identities');
  await api.addCatalogExercise(2); await settle();
  await api.reorderDraftItem(1, -1); await settle();
  check(api.draft.items[0].sourceId === 2, 'playlist reorder changes durable order');
  await api.updateDraftItem(0, { sets: 2, reps: '15 sec', rest: 20, loadWeight: 8, loadUnit: 'kg' }); await settle();
  await api.savePlaylistToSchedule(); await settle();
  check(api.workouts.length === 2 && api.workouts[0].exerciseSourceId === 2 && api.workouts[0].loadWeight === 8 && api.workouts[0].reps === '15 sec', 'schedule keeps playlist order, identity and prescription');
  const populatedDraftSnapshot = JSON.stringify(await getRecord(STORES.appState, 'playlistDraft'));
  const scheduleSnapshot = JSON.stringify(await getAll(STORES.workouts));
  api.setSearch('hold'); api.setCategory('Mobility'); api.setMuscle('abs'); api.setEquipment('gym mat'); api.setFeaturedOnly(true); await settle();
  api.clearFilters(); await settle();
  check(JSON.stringify(await getRecord(STORES.appState, 'playlistDraft')) === populatedDraftSnapshot && JSON.stringify(await getAll(STORES.workouts)) === scheduleSnapshot && api.draft.items[0].loadWeight === 8, 'filter changes and clear preserve populated durable playlist, prescriptions and schedule');
  await api.savePlaylistToSchedule(); await settle();
  check(api.workouts.length === 2 && api.playlistResult.message.includes('already'), 'repeated save does not duplicate schedule');
  await api.updateDraftItem(0, { sets: 0 }); await settle();
  await api.savePlaylistToSchedule(); await settle();
  check(api.playlistResult.error && (await getAll(STORES.workouts)).length === 2, 'invalid prescription preserves schedule');
  await api.saveCustomExercise(); await settle();
  check(api.customExerciseResult.error && api.customExercises.length === 0, 'blank custom name is rejected');
  api.setCustomExerciseDraft({ ...api.customExerciseDraft, sourceId: -42, name: 'Fixture Squat' }); await settle();
  await api.saveCustomExercise(); await settle();
  check(api.customExerciseResult.error && api.customExercises.length === 0, 'duplicate catalog name is rejected');
  api.setCustomExerciseDraft({ ...api.customExerciseDraft, name: 'Tempo Hold', primaryMuscles: 'Forearms, Legs', equipment: 'Resistance band, Dumbbell' }); await settle();
  await api.saveCustomExercise(); await settle();
  check(api.customExercises.length === 1 && api.catalog.some(item => item.sourceId === -42), 'custom save updates catalog and durable store');
  check(api.muscleOptions.some(option => option.value === 'forearms') && api.equipmentOptions.some(option => option.value === 'resistance band') && api.equipmentOptions.filter(option => option.value === 'dumbbell').length === 1, 'custom creation refreshes options and deduplicates shared equipment');
  api.setMuscle('forearms'); api.setEquipment('resistance band'); await settle();
  check(api.filteredCatalog.length === 1 && api.filteredCatalog[0].sourceId === -42, 'custom-only metadata selects the created exercise');
  await api.saveDraft({ ...api.draft, items: [] }); await settle();
  await api.addCatalogExercise(-42); await settle();
  check(api.draft.items[0].name === 'Tempo Hold', 'custom playlist uses display name');
  await api.editCustomExercise(-42); await settle();
  api.setCustomExerciseDraft({ ...api.customExerciseDraft, name: 'Renamed Hold', primaryMuscles: 'Obliques', equipment: 'Cable machine' }); await settle();
  await api.saveCustomExercise(); await settle();
  check(api.customExercises[0].sourceId === -42 && api.customExercises[0].aliases.includes('Tempo Hold') && api.draft.items[0].name === 'Renamed Hold', 'rename preserves identity and aliases and refreshes playlist label');
  check(api.muscle === '' && api.equipment === '' && !api.muscleOptions.some(option => option.value === 'forearms') && !api.equipmentOptions.some(option => option.value === 'resistance band'), 'custom edit clears vanished selections and removes old options');
  check(api.muscleOptions.some(option => option.value === 'obliques') && api.equipmentOptions.some(option => option.value === 'cable machine'), 'custom edit adds current metadata options');
  api.setMuscle('obliques'); api.setEquipment('cable machine'); await settle();
  check(api.filteredCatalog.length === 1 && api.filteredCatalog[0].sourceId === -42, 'edited custom metadata remains selectable');
  await api.deleteCustomExercise(-42); await settle();
  check(api.customExerciseResult.error && (await getAll(STORES.customExercises)).length === 1, 'playlist reference prevents deletion');
  await api.saveDraft({ ...api.draft, items: [] }); await settle();
  logs = [{ schemaVersion: 1, exercise: 'Tempo Hold', status: 'done', date: new Date().toISOString() }]; await render();
  await api.deleteCustomExercise(-42); await settle();
  check(api.customExerciseResult.error && api.customExercises.length === 1, 'historical alias reference prevents deletion');
  logs = []; await render();
  confirmed = false;
  await api.deleteCustomExercise(-42); await settle();
  check(api.customExercises.length === 1, 'canceled deletion retains custom exercise');
  check(api.muscle === 'obliques' && api.equipment === 'cable machine' && api.filteredCatalog[0]?.sourceId === -42, 'canceled custom deletion preserves valid metadata selections');
  confirmed = true;
  await api.editCustomExercise(-42); await settle();
  await api.deleteCustomExercise(-42); await settle();
  check(api.customExercises.length === 0 && !api.catalog.some(item => item.sourceId === -42) && api.customExerciseDraft.name === '', 'unreferenced deletion updates store, catalog and editor');
  check(api.muscle === '' && api.equipment === '' && api.filteredCatalog.length === 2 && !api.muscleOptions.some(option => option.value === 'obliques') && !api.equipmentOptions.some(option => option.value === 'cable machine'), 'custom deletion clears vanished selections and refreshes options and results');
  check((await getAll(STORES.workouts)).length === 2, 'custom deletion preserves unrelated schedule');
  api.setMuscle('quads'); api.setEquipment('barbell'); await settle();
  api.setCatalog([{ ...other, primaryMuscles: ['Abs'], equipment: ['Gym mat'] }]); await settle();
  check(api.muscle === '' && api.equipment === '' && api.filteredCatalog.length === 1 && api.filteredCatalog[0].sourceId === 2, 'catalog replacement clears unavailable selections after hydration or restore');
  api.setMuscle('abs'); api.setEquipment('gym mat'); await settle();
  api.setCatalog([{ ...other, primaryMuscles: [' ABS '], equipment: ['GYM MAT'] }]); await settle();
  check(api.muscle === 'abs' && api.equipment === 'gym mat' && api.filteredCatalog.length === 1, 'catalog replacement preserves still-valid normalized selections');
  document.getElementById('result').textContent = `${checks.join('\n')}\n\n${checks.length} checks passed.`;
} catch (error) { document.getElementById('result').textContent = `${checks.join('\n')}\nFAIL: ${error.stack ?? error}`; }
finally { window.confirm = originalConfirm; root.unmount(); factory.deleteDatabase(database); }
</script>
</html>
